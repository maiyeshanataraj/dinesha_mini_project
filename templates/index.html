<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Study Notes Generator</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f6f9; color: #333; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; }
        textarea { width: 100%; height: 150px; padding: 10px; border-radius: 5px; border: 1px solid #ccc; font-size: 14px; box-sizing: border-box; }
        button { background-color: #3498db; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; margin-top: 10px; width: 100%; }
        button:hover { background-color: #2980b9; }
        .results { margin-top: 30px; padding: 20px; background: #eef2f7; border-radius: 5px; }
        .metrics { display: flex; justify-content: space-between; margin-top: 15px; font-weight: bold; background: #fff; padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Smart Study Notes Generator</h1>
    <p>Paste a paragraph below to automatically generate concise study notes.</p>
    
    <form method="POST">
        <textarea name="input_text" placeholder="Enter your study text here..." required>{{ original_text }}</textarea>
        <button type="submit">Generate Summary</button>
    </form>

    {% if summary %}
    <div class="results">
        <h3>Summary:</h3>
        <p>{{ summary }}</p>

        <div class="metrics">
            <span>Original Words: {{ original_count }}</span>
            <span>Summary Words: {{ summary_count }}</span>
            <span>Reduction: {{ reduction }}%</span>
        </div>
    </div>
    {% endif %}
</div>

</body>
</html>
